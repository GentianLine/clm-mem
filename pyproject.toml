[project]
name = "shatterling"
version = "0.4.0"
description = "Zero-training long/short-term memory harness for open chat models (Qwen etc.), inspired by Context Language Models (arXiv:2609.37725)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["llm", "memory", "context-management", "clm", "qwen", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30",          # any OpenAI-compatible server (vLLM, Ollama, llama.cpp)
]

[project.optional-dependencies]
tokens = ["transformers>=4.40"]   # exact token counting with the served model's tokenizer
dev = ["pytest>=8"]

[project.scripts]
purslane = "shatterling.cli:main"
clm-mem = "shatterling.cli:main"   # deprecated alias, remove in 0.5

[tool.setuptools.packages.find]
include = ["shatterling*"]

[tool.setuptools.package-data]
"shatterling.campion" = ["*.html", "*.js", "*.css", "*.svg"]
